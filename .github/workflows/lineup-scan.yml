# ============================================================
# Radar de lineups — barrido, extracción y reporte semanal
#
# Corre todos los lunes a las 11:45 UTC (08:45 ART), 28 minutos
# después del rollover.
#
# 1. Barre las fuentes oficiales, compara hashes y guarda observaciones.
# 2. Pasa las observaciones nuevas al extractor con IA, que crea
#    propuestas en `lineup_proposals`.
# 3. Genera un reporte semanal con fuentes, detecciones, propuestas
#    nuevas/pendientes, cambios aprobados y fallos.
#
# No publica lineups: el catálogo queda intacto hasta que un admin
# apruebe cada propuesta desde el panel. El issue solo se abre si hay
# propuestas nuevas o un fallo de extracción.
# ============================================================
name: Radar de lineups (barrido + extracción semanal)

on:
  schedule:
    # Lunes 11:45 UTC (08:45 ART). Después del rollover de las 11:17,
    # fuera de la hora en punto para no competir con otros crons.
    - cron: '45 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Un barrido a la vez: si alguien dispara a mano mientras corre el
# programado, se encola en vez de duplicar requests a las fuentes.
concurrency:
  group: lineup-scan
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Revisar fuentes oficiales y guardar observaciones
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOW_LOCAL_PRODUCTION_DB: 'true'
        run: |
          node scripts/lineup-sweep.js \
            --apply-state --observe \
            --report-out=radar-scan.md \
            --json-out=radar-scan.json

      - name: Revisar datos de festivales en hiatus
        id: facts
        # Chequea fechas/edición en la web oficial de los festivales en pausa.
        # No publica nada: el resultado va al reporte semanal y al issue.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOW_LOCAL_PRODUCTION_DB: 'true'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node scripts/festival-facts.js \
            --apply --limit=20 \
            --report-out=radar-facts.md \
            --json-out=radar-facts.json

      - name: Extraer propuestas con IA
        id: extract
        # Un fallo del extractor no debe impedir que se genere el reporte:
        # el issue semanal tiene que avisar que la corrida quedó a medias.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOW_LOCAL_PRODUCTION_DB: 'true'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node scripts/lineup-extract.js \
            --apply --limit=10 \
            --report-out=radar-extract.md \
            --json-out=radar-extract.json

      - name: Generar reporte semanal
        id: report
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOW_LOCAL_PRODUCTION_DB: 'true'
        run: |
          node scripts/radar-report.js \
            --scan=radar-scan.json \
            --extract=radar-extract.json \
            --facts=radar-facts.json \
            --extract-failed=${{ steps.extract.outcome == 'failure' }} \
            --facts-failed=${{ steps.facts.outcome == 'failure' }} \
            --report-out=radar-weekly.md
          cat radar-weekly.md >> "$GITHUB_STEP_SUMMARY"

      # Modo prueba (09/11/2026): por pedido de Nelson, las primeras semanas
      # se abre un issue aunque no haya novedades, para ver el output. Cuando
      # no hay cambios, el título y el cuerpo lo dicen explícitamente. Para
      # volver al comportamiento normal, restaurar:
      #   if: steps.report.outputs.has_news == 'true'
      - name: Publicar issue semanal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "${{ steps.report.outputs.title }}" \
            --body-file radar-weekly.md \
            --assignee "nelsoncabrera06"
